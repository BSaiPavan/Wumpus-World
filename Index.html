<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDG Wumpus World</title>
<style>
:root{--bw:min(94vw,540px);--n:5;--cave:#1b1423;--stone:#3a2c3e;--stone2:#4a3850;--fog:#120c18;--ink:#f6ecdf;--mut:#b7a6bd;--torch:#ffb347;--ember:#ef5b3a;--crystal:#4ecdc4;--line:#5a4560}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -10%,#4b2f57 0,#241a2c 45%,var(--cave) 100%) fixed;display:flex;flex-direction:column;align-items:center;padding:10px 10px 90px}
header{text-align:center;margin:6px 0 4px}
h1{margin:0;font:800 clamp(1.8rem,6vw,3rem)/1 Rockwell,"Roboto Slab",Georgia,serif;letter-spacing:.02em;color:var(--torch);text-shadow:0 3px 0 #7a3b1c,0 0 28px rgba(255,179,71,.45)}
header p{margin:6px 0 0;color:var(--mut);font-size:.95rem}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin:8px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--stone);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600}
button:hover{background:var(--stone2)}
button:focus-visible{outline:3px solid var(--torch);outline-offset:2px}
button.go{background:var(--torch);border-color:#7a3b1c;color:#2a1608;font-size:1.05rem;padding:10px 22px}
.wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1120px}
#board{position:relative;width:var(--bw);aspect-ratio:1;border:4px solid #6b4f72;border-radius:16px;overflow:hidden;background:var(--fog);box-shadow:0 18px 40px rgba(0,0,0,.55)}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}
.cell{position:relative;border:1px solid rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .5s,box-shadow .5s}
.cell.fog{background:var(--fog)}
.cell.fog::after{content:"?";color:#2c2036;font:700 calc(var(--bw)/var(--n)*.5) Georgia,serif}
.cell.seen{background:radial-gradient(circle at 50% 40%,var(--stone2),var(--stone))}
.cell.here{box-shadow:inset 0 0 0 3px var(--torch),inset 0 0 26px rgba(255,179,71,.35)}
.cell.exit{box-shadow:inset 0 0 0 3px var(--crystal),inset 0 0 28px rgba(78,205,196,.7);animation:pulse 1.2s infinite alternate}
.cell.zap{background:#ffe9a8!important;transition:none}
@keyframes pulse{to{box-shadow:inset 0 0 0 3px var(--crystal),inset 0 0 8px rgba(78,205,196,.3)}}
.it{font-size:min(2.6rem,calc(var(--bw)/var(--n)*.62));line-height:1;text-align:center}
.it small{display:block;font:800 min(.8rem,calc(var(--bw)/var(--n)*.22)) Rockwell,Georgia,serif;color:var(--torch)}
.pc{position:absolute;left:4px;top:2px;font-size:min(1rem,calc(var(--bw)/var(--n)*.26))}
body.dense .co,body.dense .it small{display:none}
body.dense .pc{left:1px;top:0;line-height:1;font-size:calc(var(--bw)/var(--n)*.34)}
.co{position:absolute;right:5px;bottom:2px;font-size:.62rem;color:#8d7794}
#agent{position:absolute;width:20%;height:20%;display:flex;align-items:center;justify-content:center;font-size:min(2.9rem,calc(var(--bw)/var(--n)*.66));transition:left .3s cubic-bezier(.34,1.45,.55,1),top .3s cubic-bezier(.34,1.45,.55,1);pointer-events:none;z-index:5;filter:drop-shadow(0 4px 3px rgba(0,0,0,.6))}
#agent .face{position:absolute;inset:0;transition:transform .2s}
#agent .face::after{content:"";position:absolute;right:1px;top:50%;margin-top:-.2em;border-left:.34em solid var(--torch);border-top:.2em solid transparent;border-bottom:.2em solid transparent}
#agent.fall{transition:transform .9s ease-in,opacity .9s;transform:scale(0) rotate(540deg);opacity:0}
#shout{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;z-index:9;pointer-events:none;font:900 clamp(1.8rem,9vw,3.6rem)/1.05 Rockwell,Impact,Georgia,serif;padding:10px;-webkit-text-stroke:2px #1b1423;paint-order:stroke fill;text-shadow:0 5px 0 #1b1423}
#shout.show{display:flex;animation:shout .5s ease-out both}
#shout.bad{color:var(--ember)}#shout.good{color:var(--crystal)}#shout.warn{color:var(--torch)}
@keyframes shout{from{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.25) rotate(4deg)}to{transform:scale(1);opacity:1}}
#board.dead::before{content:"";position:absolute;inset:0;background:rgba(239,91,58,.35);z-index:8;animation:flash .5s 3}
@keyframes flash{50%{background:rgba(239,91,58,.05)}}
#board.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#side{width:min(94vw,360px);display:flex;flex-direction:column;gap:12px}
.box{background:rgba(27,20,35,.78);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.box h3{margin:0 0 8px;font:700 1rem Rockwell,Georgia,serif;color:var(--torch)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.stats div{display:flex;justify-content:space-between}.stats b{color:var(--torch)}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pl span{padding:5px 8px;border-radius:8px;background:#2a1f31;color:#6f5c77;font-size:.9rem;transition:.2s}
.pl span.on{background:var(--torch);color:#2a1608;font-weight:700}
#exitinfo{margin-top:8px;font-size:.92rem;color:var(--mut)}
#exitinfo.on{color:var(--crystal);font-weight:700}
#log{margin:0;padding:0;list-style:none;font-size:.9rem;min-height:7.6em}
#log li{padding:2px 0;color:var(--mut)}#log li:first-child{color:var(--ink);font-weight:600}
#pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin-top:14px}
#pad button{padding:12px 0;font-size:1.2rem}
#ov{position:fixed;inset:0;background:rgba(10,6,14,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;overflow:auto}
.card{max-width:600px;width:100%;background:linear-gradient(#3a2c3e,#2a1f31);border:3px solid var(--torch);border-radius:18px;padding:20px 24px;box-shadow:0 20px 60px #000}
.card h2{margin:0 0 10px;font:800 1.7rem Rockwell,Georgia,serif;color:var(--torch)}
.card ol{margin:0 0 12px;padding-left:1.2em;line-height:1.5}.card li{margin-bottom:4px}
kbd{background:var(--ink);color:#2a1608;border-radius:5px;padding:1px 7px;font-weight:700;font-size:.9em}
.ctl{background:#1b1423;border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:.95rem;line-height:1.7}
.card .btns{text-align:center}.big{font-size:1.15rem;margin:6px 0 12px}
.size{display:flex;align-items:center;gap:8px;background:var(--stone);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600}
.size input{accent-color:var(--torch);width:150px}.size b{color:var(--torch);min-width:3.4em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>NDG Wumpus World</h1>
  <p>Find the gold, dodge the pits, outsmart NDG, and walk out alive.</p>
</header>
<div class="top"><button id="bRules">📜 Rules</button><button id="bNew">🔄 New cave (R)</button><button id="bMute">🔊 Sound</button><label class="size">Grid size <input id="size" type="range" min="5" max="20" value="5"> <b id="sizeLbl">5×5</b></label></div>

<main class="wrap">
  <section>
    <div id="board">
      <div id="grid"></div>
      <div id="agent"><div class="face"></div><span>🧑‍🚀</span></div>
      <div id="shout"></div>
    </div>
    <div id="pad" aria-label="On-screen controls">
      <button data-k="g">G</button><button data-k="up">▲</button><button data-k="shoot">🏹</button>
      <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
    </div>
  </section>
  <aside id="side">
    <div class="box"><h3>Your status</h3>
      <div class="stats"><div>Score <b id="sScore">0</b></div><div>Moves <b id="sMoves">0</b></div><div>Gold <b id="sGold">no</b></div><div>Arrow <b id="sArrow">0</b></div></div>
      <div id="exitinfo">Grab the 💰 to open the exit door.</div>
    </div>
    <div class="box"><h3>What you sense here</h3>
      <div class="pl"><span id="pBreeze">💨 Breeze</span><span id="pStench">🤢 Stench</span><span id="pGlitter">✨ Glitter</span><span id="pBump">💥 Bump</span><span id="pScream">😱 Scream</span></div>
    </div>
    <div class="box"><h3>Cave log</h3><ul id="log"></ul></div>
  </aside>
</main>

<div id="ov"><div class="card" id="card"></div></div>

<script>
let N=5;const D=[[0,1],[1,0],[0,-1],[-1,0]], $=id=>document.getElementById(id);
const key=(r,c)=>r*N+c, lab=k=>String.fromCharCode(65+k%N)+(N-Math.floor(k/N));
const nb=(r,c)=>[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null, started=false, muted=false, AC=null, ovAct=null, cells=[];

/* ---------- sound ---------- */
function snd(f1,f2,d,t='sine',v=.07){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function say(t,p=1.7){if(muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=p;u.rate=1.1;u.volume=1;speechSynthesis.speak(u)}catch(e){}}

/* ---------- grid size ---------- */
function pitCount(){return Math.max(3,Math.round(N*N*.12))}
function setSize(n){
  N=n;const R=document.documentElement.style;R.setProperty('--n',N);R.setProperty('--bw',N>10?'min(94vw,700px)':'min(94vw,540px)');
  document.body.classList.toggle('dense',N>12);
  const g=$('grid');g.style.gridTemplateColumns=g.style.gridTemplateRows='repeat('+N+',1fr)';
  const a=$('agent');a.style.width=a.style.height=(100/N)+'%';$('sizeLbl').textContent=N+'×'+N;
}

/* ---------- world ---------- */
function gen(){
  for(;;){
    const st=[N-1,0], safe=new Set([key(...st),...nb(...st).map(p=>key(...p))]), free=[], all=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){all.push([r,c]);if(!safe.has(key(r,c)))free.push([r,c])}
    shuf(free);
    const P=pitCount(), pits=new Set(free.slice(0,P).map(p=>key(...p))), w=free[P];
    const rest=shuf(all.filter(p=>key(...p)!==key(...st)&&!pits.has(key(...p))&&key(...p)!==key(...w)));
    const gold=rest[0], arrow=rest[1];
    const seen=reach(st,pits,key(...w));
    if(seen.has(key(...gold))&&seen.has(key(...arrow)))return{pits,w,gold,arrow};
  }
}
function reach(from,pits,wk){ // BFS avoiding pits (and the wumpus square), returns Map key->distance
  const d=new Map([[key(...from),0]]),q=[from];
  while(q.length){const [r,c]=q.shift();for(const [a,b] of nb(r,c)){const k=key(a,b);if(d.has(k)||pits.has(k)||k===wk)continue;d.set(k,d.get(key(r,c))+1);q.push([a,b])}}
  return d;
}
function newGame(){
  const w=gen();
  S={...w,pos:[N-1,0],d:0,seen:new Set([key(N-1,0)]),score:0,moves:0,arrows:0,hasGold:false,arrowTaken:false,wAlive:true,exit:null,over:false,bump:false,scream:false,log:[]};
  $('board').classList.remove('dead');$('agent').classList.remove('fall');$('shout').className='';
  grid();log('You step into the cave at A1. Stay sharp!');render();
}
function grid(){
  const g=$('grid');g.innerHTML='';cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const e=document.createElement('div');e.innerHTML='<span class="pc"></span><span class="it"></span><span class="co">'+lab(key(r,c))+'</span>';g.appendChild(e);cells.push(e)}
}
function pcpt(r,c){
  const n=nb(r,c);
  return{breeze:n.some(([a,b])=>S.pits.has(key(a,b))),stench:S.wAlive&&n.some(([a,b])=>a===S.w[0]&&b===S.w[1]),glitter:!S.hasGold&&S.gold[0]===r&&S.gold[1]===c};
}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,6)}

/* ---------- render ---------- */
function render(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const k=key(r,c),e=cells[k],isExit=S.exit===k,vis=S.seen.has(k)||S.over||isExit;
    e.className='cell '+(vis?'seen':'fog')+(isExit?' exit':'')+(S.pos[0]===r&&S.pos[1]===c&&!S.over?' here':'');
    let it='',pc='';
    if(vis){
      if(S.pits.has(k))it+='🕳️';
      if(S.w[0]===r&&S.w[1]===c)it+=S.wAlive?'👹<small>NDG</small>':'💀<small>NDG</small>';
      if(S.gold[0]===r&&S.gold[1]===c&&!S.hasGold)it+='💰';
      if(S.arrow[0]===r&&S.arrow[1]===c&&!S.arrowTaken)it+='🏹';
      if(isExit)it+='🚪';
      if(S.seen.has(k)||S.over){const p=pcpt(r,c);pc=(p.breeze?'💨':'')+(p.stench?'🤢':'')+(p.glitter?'✨':'')}
    }
    e.children[0].textContent=pc;e.children[1].innerHTML=it;
  }
  const a=$('agent');a.style.left=S.pos[1]*100/N+'%';a.style.top=S.pos[0]*100/N+'%';a.firstElementChild.style.transform='rotate('+S.d*90+'deg)';
  const p=pcpt(...S.pos);
  [['pBreeze',p.breeze],['pStench',p.stench],['pGlitter',p.glitter],['pBump',S.bump],['pScream',S.scream]].forEach(([i,v])=>$(i).classList.toggle('on',!!v));
  $('sScore').textContent=S.score;$('sMoves').textContent=S.moves;$('sGold').textContent=S.hasGold?'yes 💰':'no';$('sArrow').textContent=S.arrows?'1 🏹':'0';
  const x=$('exitinfo');x.className=S.exit!==null?'on':'';x.textContent=S.exit!==null?'🚪 Exit door is at '+lab(S.exit)+'. Get there alive!':'Grab the 💰 to open the exit door.';
  $('log').innerHTML=S.log.map(t=>'<li>'+t+'</li>').join('');
}
function shout(t,cls){const s=$('shout');s.textContent=t;s.className='';void s.offsetWidth;s.className='show '+cls}
function shake(){const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}

/* ---------- actions ---------- */
function live(){return started&&S&&!S.over&&$('ov').style.display!=='flex'}
function move(d){
  if(!live())return;
  S.bump=false;S.scream=false;S.d=d;
  const [r,c]=S.pos,nr=r+D[d][0],nc=c+D[d][1];
  if(nr<0||nc<0||nr>=N||nc>=N){S.bump=true;log('💥 Bump! A cold stone wall.');snd(140,60,.15,'square');shake();return render()}
  S.pos=[nr,nc];S.moves++;S.score--;const k=key(nr,nc);S.seen.add(k);snd(320,420,.08,'triangle',.05);
  if(S.pits.has(k)){render();return die('pit')}
  if(S.wAlive&&S.w[0]===nr&&S.w[1]===nc){render();return die('wumpus')}
  if(S.hasGold&&S.exit===k){render();return win()}
  const p=pcpt(nr,nc),s=[];
  if(p.breeze)s.push('a breeze 💨 (pit nearby)');if(p.stench)s.push('a stench 🤢 (NDG is close)');if(p.glitter)s.push('glitter ✨ (press G!)');
  if(S.arrow[0]===nr&&S.arrow[1]===nc&&!S.arrowTaken)s.push('an arrow 🏹 on the floor (press G)');
  log(lab(k)+': '+(s.length?'you sense '+s.join(', ')+'.':'all quiet.'));
  render();
}
function grab(){
  if(!live())return;S.bump=false;S.scream=false;
  const [r,c]=S.pos;
  if(!S.hasGold&&S.gold[0]===r&&S.gold[1]===c){
    S.hasGold=true;S.score+=1000;snd(600,1200,.35,'triangle',.1);
    const d=reach(S.pos,S.pits,S.wAlive?key(...S.w):-1);d.delete(key(r,c));
    let opts=[...d].filter(([k,v])=>v>=2).map(x=>x[0]);if(!opts.length)opts=[...d].map(x=>x[0]);
    S.exit=opts.length?opts[Math.floor(Math.random()*opts.length)]:key(N-1,0);
    log('💰 Gold grabbed! +1000. The exit door opened at '+lab(S.exit)+'.');shout('GOLD!','warn');setTimeout(()=>{if(!S.over)$('shout').className=''},900);
  }else if(!S.arrowTaken&&S.arrow[0]===r&&S.arrow[1]===c){
    S.arrowTaken=true;S.arrows=1;snd(500,800,.2,'triangle',.08);log('🏹 You picked up the arrow. Press Space to shoot.');
  }else{log('Nothing to grab here.');snd(150,100,.1,'square',.04)}
  render();
}
function shoot(){
  if(!live())return;S.bump=false;S.scream=false;
  if(!S.arrows){log('No arrow! Find the 🏹 and press G to pick it up.');snd(150,100,.1,'square',.04);return render()}
  S.arrows=0;S.score-=10;snd(900,200,.3,'sawtooth',.05);
  let [r,c]=S.pos,hit=false;const path=[];
  for(;;){r+=D[S.d][0];c+=D[S.d][1];if(r<0||c<0||r>=N||c>=N)break;path.push(key(r,c));if(S.wAlive&&S.w[0]===r&&S.w[1]===c)hit=true}
  path.forEach((k,i)=>setTimeout(()=>{cells[k].classList.add('zap');setTimeout(()=>cells[k].classList.remove('zap'),300)},i*90));
  if(hit){S.wAlive=false;S.scream=true;log('😱 NDG lets out a horrible scream. The Wumpus is dead!');
    setTimeout(()=>{snd(500,70,.9,'sawtooth',.12);shout('NDG: AAAARGH!','warn');say('Aaaargh!',.3);setTimeout(()=>{if(!S.over)$('shout').className=''},1300)},path.length*90)}
  else log('🏹 Your arrow flies off into the dark and hits nothing.');
  render();
}
function die(type){
  S.over=true;S.score-=1000;
  const t=type==='pit'?'AAAAAAHHH!!!':'NDG GOT ME! AAARGH!!!';
  log(type==='pit'?'🕳️ You fell into a bottomless pit!':'👹 NDG the Wumpus devoured you!');
  if(type==='pit')$('agent').classList.add('fall');
  $('board').classList.add('dead');shake();shout(t,'bad');say(t.replace(/!+/g,'!'),1.9);
  snd(900,60,1.2,'sawtooth',.14);setTimeout(()=>snd(400,40,.8,'square',.08),300);
  render();
  setTimeout(()=>showOv('<h2>💀 You died</h2><p class="big">'+(type==='pit'?'You fell into a pit.':'NDG the Wumpus ate you.')+'</p><p>Final score: <b>'+S.score+'</b> after '+S.moves+' moves. The whole cave is revealed behind this screen.</p><div class="btns"><button class="go" id="bGo">Try a new cave (Enter)</button></div>',begin),2200);
}
function win(){
  S.over=true;snd(400,1600,.6,'triangle',.1);setTimeout(()=>snd(800,1800,.5,'triangle',.1),250);
  log('🚪 You escaped with the gold!');shout('ESCAPED!','good');say('Yes! I escaped with the gold!',1.5);render();
  setTimeout(()=>showOv('<h2>🏆 You escaped!</h2><p class="big">You grabbed the gold and walked out through the exit at '+lab(S.exit)+'.</p><p>Final score: <b>'+S.score+'</b> in '+S.moves+' moves'+(S.wAlive?'. NDG is still alive, you outwitted it.':'. You even slew NDG!')+'</p><div class="btns"><button class="go" id="bGo">Play again (Enter)</button></div>',begin),1900);
}

/* ---------- overlay & input ---------- */
const RULES=()=>'<h2>📜 NDG Wumpus World: Rules</h2><ol>'+
'<li><b>Goal:</b> grab the 💰 gold, then reach the 🚪 exit door that opens after you take it.</li>'+
'<li><b>The cave:</b> a '+N+'×'+N+' grid (change it with the Grid size slider, from 5×5 up to 20×20). You start at <b>A1</b> (bottom-left). Unexplored squares sit in fog.</li>'+
'<li><b>Pits 🕳️</b> ('+pitCount()+' of them): step in and you fall. Squares next to a pit have a <b>breeze 💨</b>.</li>'+
'<li><b>NDG the Wumpus 👹:</b> walk into its square and it eats you. Squares next to it have a <b>stench 🤢</b>.</li>'+
'<li><b>Grabbing:</b> ✨ glitter means gold is on your square. Press <kbd>G</kbd> to grab it. The same <kbd>G</kbd> picks up the lone 🏹 arrow lying somewhere in the cave.</li>'+
'<li><b>Shooting:</b> with the arrow, press <kbd>Space</kbd> to fire the way you’re facing (the yellow marker). Hit NDG and you’ll hear it scream. You only get one arrow.</li>'+
'<li><b>The exit:</b> after you grab the gold, a 🚪 door appears on a safe square, and it isn’t always the start. Walk there to escape.</li>'+
'<li><b>Dying:</b> fall into a pit or meet NDG and the agent screams. 😱</li>'+
'<li><b>Score:</b> −1 per move, −10 for shooting, +1000 for gold, −1000 for dying.</li></ol>'+
'<div class="ctl"><b>Move:</b> arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br><b>Grab:</b> <kbd>G</kbd> &nbsp; <b>Shoot:</b> <kbd>Space</kbd> &nbsp; <b>New cave:</b> <kbd>R</kbd></div>';
function showOv(html,act){$('card').innerHTML=html;$('ov').style.display='flex';ovAct=act;const b=$('bGo');if(b){b.onclick=act;b.focus()}}
function hideOv(){$('ov').style.display='none';ovAct=null}
function begin(){started=true;hideOv();newGame();snd(300,600,.2,'triangle',.06)}
function help(){
  if(!started)return showOv(RULES()+'<div class="btns"><button class="go" id="bGo">Start the adventure (Enter)</button></div>',begin);
  showOv(RULES()+'<div class="btns"><button class="go" id="bGo">Back to the cave (Enter)</button></div>',hideOv);
}
const KM={arrowright:0,d:0,arrowdown:1,s:1,arrowleft:2,a:2,arrowup:3,w:3};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.target&&e.target.id==='size')return;
  if($('ov').style.display==='flex'){if(e.key==='Enter'&&ovAct){e.preventDefault();ovAct()}return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k in KM){e.preventDefault();move(KM[k])}
  else if(k==='g')grab();
  else if(k===' '||k==='f'){e.preventDefault();shoot()}
  else if(k==='r')begin();
});
document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='g')grab();else if(k==='shoot')shoot();else move({right:0,down:1,left:2,up:3}[k])});
$('size').oninput=e=>{$('sizeLbl').textContent=e.target.value+'×'+e.target.value};
$('size').onchange=e=>{setSize(+e.target.value);e.target.blur();begin()};
$('bRules').onclick=help;$('bNew').onclick=begin;
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'🔇 Muted':'🔊 Sound';if(muted&&window.speechSynthesis)speechSynthesis.cancel()};

setSize(5);grid();S={pits:new Set(),w:[-1,-1],gold:[-1,-1],arrow:[-1,-1],pos:[N-1,0],d:0,seen:new Set([key(N-1,0)]),score:0,moves:0,arrows:0,hasGold:false,arrowTaken:false,wAlive:true,exit:null,over:false,log:[]};
render();help();
</script>
</body>
</html>
